<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto - Game da Sala</title>
    <link rel="stylesheet" href="detalhes.css">
</head>
<body>

    <header class="header">
        <h1>🎮 GAME DA SALA - ESTÁCIO</h1>
        <nav>
            <a href="vitrine.html">VITRINE</a>
            <a href="carrinho.html">🛒 MEU CARRINHO</a>
        </nav>
    </header>

    <main class="container">
        <section class="product-detail">
            <div class="product-image">
                <img id="detalhe-img" src="" alt="Capa do Jogo">
            </div>
            
            <div class="product-info">
                <h2 id="detalhe-nome">Carregando...</h2>
                
                <div class="info-row">
                    <span class="info-label">Plataforma:</span>
                    <span class="info-value" id="detalhe-plataforma"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Gênero:</span>
                    <span class="info-value" id="detalhe-genero"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Lançamento:</span>
                    <span class="info-value" id="detalhe-lancamento"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Classificação:</span>
                    <span class="info-value" id="detalhe-classificacao"></span>
                </div>

                <p class="description" id="detalhe-descricao"></p>
                
                <div class="price">
                    R$ <span id="detalhe-preco">0,00</span>
                </div>

                <div class="btn-group">
                    <a href="vitrine.html" class="btn-voltar">← VOLTAR</a>
                    <button id="btn-comprar-detalhe" class="btn-comprar">🛒 COMPRAR AGORA</button>
                </div>
            </div>
        </section>

        <section class="tech-specs">
            <h3>FICHA TÉCNICA</h3>
            <div class="specs-grid">
                <div class="spec-item">
                    <span class="spec-label">Desenvolvedora: </span>
                    <span id="detalhe-desenvolvedora"></span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Distribuidora: </span>
                    <span id="detalhe-distribuidora"></span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Modos de jogo: </span>
                    <span id="detalhe-modos"></span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Idiomas: </span>
                    <span id="detalhe-idiomas"></span>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 Estácio - Disciplina de Programação Web I</p>
    </footer>

    <script src="produtos.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const idProduto = parseInt(urlParams.get('id')) || 1;

        const produto = produtos.find(p => p.id === idProduto);

        if (produto) {
            document.getElementById('detalhe-img').src = produto.imagem;
            document.getElementById('detalhe-nome').innerText = produto.nome;
            document.getElementById('detalhe-plataforma').innerText = produto.plataforma;
            document.getElementById('detalhe-genero').innerText = produto.genero;
            document.getElementById('detalhe-lancamento').innerText = produto.lancamento;
            document.getElementById('detalhe-classificacao').innerText = produto.classificacao;
            document.getElementById('detalhe-descricao').innerText = produto.descricao;
            document.getElementById('detalhe-preco').innerText = produto.preco.toFixed(2).replace('.', ',');
            document.getElementById('detalhe-desenvolvedora').innerText = produto.desenvolvedora;
            document.getElementById('detalhe-distribuidora').innerText = produto.distribuidora;
            document.getElementById('detalhe-modos').innerText = produto.modos;
            document.getElementById('detalhe-idiomas').innerText = produto.idiomas;

            document.getElementById('btn-comprar-detalhe').addEventListener('click', () => {
                let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
                const itemExistente = carrinho.find(item => item.id === idProduto);

                if (itemExistente) {
                    itemExistente.quantidade += 1;
                } else {
                    carrinho.push({
                        id: produto.id,
                        nome: produto.nome,
                        preco: produto.preco,
                        imagem: produto.imagem,
                        quantidade: 1
                    });
                }
                localStorage.setItem('carrinho', JSON.stringify(carrinho));
                window.location.href = 'carrinho.html';
            });
        } else {
            document.getElementById('detalhe-nome').innerText = "Produto não encontrado.";
        }
    </script>
</body>
</html>
